name: Deno - Test facoltativo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-deno:
    name: Verifica Deno
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v7

      - name: Installa Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: lts

      - name: Mostra versione Deno
        run: deno --version
